# The documentation, built and served by the image its own maintainers publish.
#
# Nothing is installed on the host — the same rule the main repository works
# under, where every command goes through `bin/compose`. `bin/docs` wraps this.
services:
    docs:
        image: squidfunk/mkdocs-material:9
        working_dir: /docs
        volumes:
            - .:/docs
        ports:
            # 8081 rather than the image's default 8000 and rather than 8080,
            # because the main repository's stack publishes Adminer on 8080 and
            # the two are routinely up together — somebody reading this is
            # usually running the thing it documents. DOCS_PORT overrides it.
            - "127.0.0.1:${DOCS_PORT:-8081}:8000"
        # The image runs as root and writes `site/` into the mounted tree. Match
        # the host user so the build output stays editable and deletable, which
        # is the same reason `bin/compose` passes APP_UID/APP_GID next door.
        user: "${DOCS_UID:-1000}:${DOCS_GID:-1000}"
